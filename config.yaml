operating_mode: advisor
traffic_source: simulation
database:
  host: localhost
  port: 1433
  dbname: vortex_db
  user: sa
  password: VortexPassword123!
  pool_min: 2
  pool_max: 10
detection:
  min_mean_exec_time_ms: 50
  min_total_exec_time_ms: 1000
  min_calls: 5
  seq_scan_row_threshold: 10000
  filter_removal_threshold: 10000
  buffer_hit_threshold: 100000
  top_queries_limit: 20
remediation:
  enabled: true
  dry_run_default: true
  max_indexes_per_table: 5
  max_indexes_total: 20
  cooldown_minutes: 60
  rollback_policy: per_index
benchmark:
  runs: 3
  degradation_threshold_pct: 10.0
  improvement_threshold_pct: 5.0
scheduler:
  analysis_interval_minutes: 30
  unused_index_check_hours: 24
notification:
  enabled: false
  webhook_url: ''
  alert_on:
  - critical_issue
  - rollback
  - new_index_applied
logging:
  level: INFO
  file: logs/vortexdba.log
  max_size_mb: 50
