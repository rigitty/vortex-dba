name: Release - Build Windows Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Application & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

      - name: Build executable with PyInstaller
        run: |
          python build_exe.py

      - name: Package release ZIP
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_name }}" -ne "") { "${{ github.ref_name }}" } else { "latest" }
          $zipName = "VortexDBA-${tag}-windows-x64.zip"
          Compress-Archive -Path "dist\VortexDBA\*" -DestinationPath $zipName
          Write-Output "RELEASE_ZIP=$zipName" >> $env:GITHUB_ENV

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_ZIP }}
          generate_release_notes: true
          draft: false
          prerelease: false
